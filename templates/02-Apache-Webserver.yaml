AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Template CloudFormation - Criando um Webserver com Apache instalado via UserData.
  Stack: Webserver

Resources:
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group - Permite acesso HTTP (80) e SSH (22)
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Permite acesso HTTP de qualquer origem
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: Permite acesso SSH de qualquer origem
      Tags:
        - Key: Name
          Value: SG-Webserver

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      AvailabilityZone: us-east-1a
      ImageId: ami-0ed9277fb7eb570c9
      InstanceType: t2.micro
      SecurityGroups:
        - !Ref WebServerSecurityGroup
      UserData:
        Fn::Base64: |
          #!/bin/bash
          yum update -y
          yum install -y httpd
          systemctl start httpd
          systemctl enable httpd
          echo "<h1>Webserver provisionado via AWS CloudFormation - DIO</h1>" > /var/www/html/index.html
      Tags:
        - Key: Name
          Value: Webserver

Outputs:
  WebServerInstanceId:
    Description: ID da instancia Webserver
    Value: !Ref WebServer
  WebServerPublicIP:
    Description: IP publico do Webserver
    Value: !GetAtt WebServer.PublicIp
  WebServerURL:
    Description: URL de acesso ao Apache
    Value: !Sub 'http://${WebServer.PublicIp}'
